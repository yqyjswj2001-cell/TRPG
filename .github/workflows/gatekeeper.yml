# ============================================================
# 守门员检查
# 每次你往仓库提交代码,这份"工作手册"就会让 GitHub 的
# 免费机器人自动跑一遍下面的体检项目。
# 全部通过 → 绿色对勾;任何一项失败 → 红色叉叉 + 邮件提醒。
# 这个文件不需要修改,放进 .github/workflows/ 就能直接用。
# ============================================================
name: 守门员检查(每次提交自动体检)

on:
  push:               # 每次推送代码时运行
  pull_request:       # 每次发起合并请求时运行
  workflow_dispatch:  # 也允许你在 Actions 页面手动点按钮运行

jobs:
  check:
    runs-on: ubuntu-latest   # 在 GitHub 免费提供的 Linux 机器上运行
    steps:
      # 第 1 步:把你的仓库代码下载到机器人那台机器上
      - name: 下载代码
        uses: actions/checkout@v4

      # 第 2 步:装好 Python(AstrBot 插件用的语言)
      - name: 准备 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 第 3 步:安装项目依赖和检查工具
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest

      # 第 4 步:只查"会让程序直接崩溃"的硬伤
      # (语法写错、用了不存在的变量名等,不管代码美不美观)
      - name: 语法硬伤检查
        run: ruff check . --select E9,F63,F7,F82 --output-format=github

      # 第 5 步:检查有没有不小心把 API 密钥明文写进了文件里
      - name: 密钥泄露检查
        run: |
          if grep -rInE "sk-[A-Za-z0-9_-]{20,}" --exclude-dir=.git \
               --include="*.py" --include="*.json" --include="*.yaml" --include="*.yml" . ; then
            echo "::error::疑似把 API 密钥直接写进了文件里!请删掉,改用配置文件保存并加入 .gitignore。"
            exit 1
          fi
          echo "没有发现明文密钥,安全。"

      # 第 6 步:给所有游戏数据文件做体检(功法/法宝/NPC 等 JSON)
      - name: 数据文件体检
        run: |
          if [ -f scripts/check_data.py ]; then
            python scripts/check_data.py
          else
            echo "还没有 scripts/check_data.py,先跳过这一项。"
          fi

      # 第 7 步:运行"铁律测试"(骰子、数值上限、回滚等核心规则)
      - name: 核心规则测试
        run: |
          if [ -d tests ]; then
            pytest tests/ -v
          else
            echo "还没有 tests 文件夹,先跳过这一项。"
          fi
