# ============================================================
# 夜间巡检
# 每天凌晨 4 点(北京/新加坡时间)自动做一次更全面的深度检查,
# 防止问题"慢慢烂掉"却没人发现。
# 你也可以随时在 Actions 页面手动点按钮运行它。
# 注意:定时任务只在默认分支(一般是 main)上生效。
# ============================================================
name: 夜间巡检(每天自动深度检查)

on:
  schedule:
    - cron: "0 20 * * *"   # UTC 时间 20:00 = 北京/新加坡时间凌晨 4:00
  workflow_dispatch:        # 允许手动点按钮运行

jobs:
  deep-check:
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 准备 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest pip-audit

      - name: 数据文件体检
        run: |
          if [ -f scripts/check_data.py ]; then
            python scripts/check_data.py
          else
            echo "还没有 scripts/check_data.py,先跳过这一项。"
          fi

      - name: 完整测试
        run: |
          if [ -d tests ]; then
            pytest tests/ -v
          else
            echo "还没有 tests 文件夹,先跳过这一项。"
          fi

      # 数值曲线体检(提醒性质):按品阶/境界分组,自动标出明显偏强或偏弱的条目,
      # 不代表一定有问题,只是提醒你去人工复核一下(配合《游戏性与平衡性评审手册》使用)。
      - name: 数值曲线体检(提醒性质)
        continue-on-error: true
        run: |
          if [ -f scripts/check_balance.py ]; then
            python scripts/check_balance.py
          else
            echo "还没有 scripts/check_balance.py,先跳过这一项。"
          fi

      # 依赖漏洞扫描:检查你用到的第三方库有没有已知安全漏洞。
      # 设为"提醒性质",发现问题不会亮红叉,只会在日志里给出黄色警告,
      # 你抽空升级对应的库即可。
      - name: 依赖漏洞扫描(提醒性质)
        continue-on-error: true
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || echo "::warning::有依赖库存在已知安全漏洞,建议抽空升级(详情见上方日志)。"
          else
            echo "没有 requirements.txt,跳过。"
          fi
